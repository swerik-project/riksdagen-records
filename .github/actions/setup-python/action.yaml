name: "Set up Python"

runs:
  using: "composite"
  steps:
  - name: Set up Python ${{ matrix.python-version }}
    uses: actions/setup-python@v5
    with:
      python-version: ${{ matrix.python-version }}

  - name: Add project root to PYTHONPATH
    run: echo "PYTHONPATH=$GITHUB_WORKSPACE" >> $GITHUB_ENV
    shell: bash
